[package]
name = "mluau"
version = "0.11.5" # remember to update mlua_derive
authors = ["cheesycod", "Dev Chrysalis Dalal <dev@deviaze.com>","Aleksandr Orlenko <zxteam@pm.me>", "kyren <catherine@kyju.org>"]
rust-version = "1.85.0"
edition = "2024"
repository = "https://github.com/luwu-community/mluau"
documentation = "https://docs.rs/mluau"
readme = "README.md"
keywords = ["luau", "luwu", "scripting"]
categories = ["api-bindings"]
license = "MIT"
description = """
High level bindings to Luwu.
"""

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["mlua-sys"]

[features]
default = ["dynamic-userdata", "bytes", "none-primitive", "serde"]
luau-jit = ["ffi/luau-codegen"]
luau-vector4 = ["ffi/luau-vector4"]
# Luwu's user-defined classes (luwu rfcs/classes.md), which diverge from upstream Luau's. Still
# experimental (gated behind fastflags prefixed `Debug*`) and its shape may still change, so this is opt-in.
luwu-classes = ["ffi/luwu-classes"]
# Custom `none` primitive in mluau/luau
none-primitive = ["ffi/none-primitive"]

serde = ["dep:serde", "bstr/serde", "none-primitive"]
dynamic-userdata = []

bytes = ["dep:bytes"]

# deprecated features
luau = [] # no-op
serialize = ["serde"]
vendored = []
bumpalo = ["dep:bumpalo"]

[dependencies]

bstr = { version = "1.0", features = ["std"], default-features = false }
either = "1.0"
num-traits = { version = "0.2.14" }
rustc-hash = "2.0"
serde = { version = "1.0", optional = true }
libc = "0.2"

ffi = { package = "mlua-sys", version = "0.9.0", path = "mlua-sys" }
bytes = { version = "1.0", optional = true }
bumpalo = { version = "3", optional = true }

[dev-dependencies]
trybuild = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
maplit = "1.0"
static_assertions = "1.0"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }