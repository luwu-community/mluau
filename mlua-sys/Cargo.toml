[package]
name = "mlua-sys"
version = "0.9.0"
authors = ["cheesycod", "Aleksandr Orlenko <zxteam@pm.me>"]
rust-version = "1.71"
edition = "2021"
repository = "https://github.com/luwu-community/mluau"
documentation = "https://docs.rs/mluau-sys"
readme = "README.md"
categories = ["external-ffi-bindings"]
license = "MIT"
links = "lua"
build = "build/main.rs"
description = """
Low level (FFI) bindings to Luwu
"""

[package.metadata.docs.rs]
features = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
luau-codegen = []
luau-vector4 = []
# Luau's user-defined classes support is experimental upstream (gated behind
# fastflags prefixed `Debug*`) and its shape may still change, so bindings for it
# are opt-in.
luwu-classes = []
none-primitive = []
external = []
module = []

[dependencies]

[build-dependencies]
cc = "1.0"
cfg-if = "1.0"
pkg-config = "0.3.17"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(raw_dylib)'] }
